name = "payrald-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT       = "production"
SUPABASE_URL      = "https://onxdcikfttdmnhofsuwo.supabase.co"
PAYRALD_CORE_URL  = "https://core.pay.rald.cloud"
ROUTING_URL       = "https://routing.rald.cloud"

[[routes]]
pattern = "pay.rald.cloud/*"
zone_name = "rald.cloud"

# KV namespace for rate limiting — create with: wrangler kv namespace create RATE_LIMIT_KV
# Then uncomment and replace the id below:
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "<32-char-hex-id>"

[observability]
enabled = true
head_sampling_rate = 1

# ── Secrets — wrangler secret put <KEY> ────────────────────────────────────────
# SUPABASE_SERVICE_ROLE_KEY   RALD_JWT_SECRET   MACHINE_IDENTITY_SECRET
